name: Verify candidate streams

# Maintenance job, run by hand. Probes the wide candidate pool in
# tools/candidate_pool.json so the catalog can be rebuilt from URLs that
# actually answer, instead of from URLs that looked right when they were
# written. Broadcaster CDNs move often enough that this is the only honest way
# to curate the lineup.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/candidate_pool.json"
      - ".github/workflows/candidates.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the candidate pool
        run: python3 tools/check_streams.py --pool --timeout 12 --jobs 24

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-results
          path: tools/candidate_results.json
          if-no-files-found: error

      # Committed as well as uploaded: the results are the input to curating
      # the catalog, and reading them out of the repo beats scraping them back
      # out of a truncated job log.
      - name: Commit the results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/candidate_results.json
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -m "Record candidate stream probe results [skip ci]"
          # The branch can move while a probe is in flight (another push, or the
          # sibling workflow committing its own report), and a straight push
          # then loses the run's work. Rebase onto whatever landed and retry.
          for attempt in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::could not push after 3 attempts"
          exit 1
