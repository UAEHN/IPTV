name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    paths-ignore:
      - "**/*.md"
      - "channels/health.json"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keep the bundled catalog in sync with channels/
        run: |
          python3 tools/sync_catalog.py
          git diff --exit-code -- app/src/main/assets/channels.json \
            || { echo "::error::app/src/main/assets/channels.json is stale; run tools/sync_catalog.py"; exit 1; }

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the artifact
        id: apk
        run: |
          src=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          out="shasha-${version}-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          # A second copy under a fixed name, so the release carries one URL
          # that never changes and can be pasted into a TV sideloader.
          cp "$src" shasha.apk
          echo "path=$out"        >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -lh "$out" shasha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shasha-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # A rolling `latest` release, replaced on every green build. Actions
      # artifacts need a GitHub login and expire; a release asset is a plain
      # URL you can paste into a TV sideloader, which is the whole point of an
      # app that is not on the Play Store.
      - name: Publish the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          count=$(python3 -c "import json;print(len(json.load(open('channels/channels.json'))['channels']))")
          {
            printf 'Sideload build of Shasha — %s Arabic channels.\n\n' "$count"
            printf 'Download **shasha.apk** below — that name is stable across builds.\n\n'
            printf -- '- **Phone** — open it and allow installing from your browser.\n'
            printf -- '- **TV** — copy it over on a USB stick, or `adb install -r` it from a computer on the same network.\n\n'
            printf 'Updates install over the top; every build is signed with the same key.\n\n'
            printf 'Built from `%s` on `%s`.\n' "${GITHUB_SHA::7}" "$GITHUB_REF_NAME"
          } > notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Shasha $VERSION" --notes-file notes.md
            gh release upload latest shasha.apk --clobber
            # One asset only. Version-stamped copies from earlier builds would
            # otherwise pile up on a release that is meant to mean "current";
            # that copy lives on as this run's Actions artifact instead.
            gh release view latest --json assets \
              --jq '.assets[].name | select(. != "shasha.apk")' \
            | while read -r stale; do
                echo "removing stale asset $stale"
                gh release delete-asset latest "$stale" --yes
              done
          else
            gh release create latest shasha.apk \
              --title "Shasha $VERSION" --notes-file notes.md
          fi
